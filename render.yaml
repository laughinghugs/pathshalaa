services:
  # FastAPI backend. The "No open ports detected on 0.0.0.0" error comes
  # from Render's start-command health check: it requires the process to
  # bind 0.0.0.0:$PORT, not a fixed port or 127.0.0.1 (uvicorn's default).
  - type: web
    name: pathshalaa-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_DOMAIN
        value: ""
      - key: SECRET_KEY
        generateValue: true
      # Set this to the deployed frontend's origin once you know it (e.g.
      # https://pathshalaa-frontend.onrender.com) — Render doesn't know it
      # until that service's first deploy, so it can't be auto-filled here.
      - key: CORS_ORIGINS
        sync: false

  # Vite static build of the frontend.
  - type: web
    name: pathshalaa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # Must point at the backend service's URL + /api (e.g.
      # https://pathshalaa-backend.onrender.com/api) — same reason as
      # CORS_ORIGINS above, fill in after the backend's first deploy.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
